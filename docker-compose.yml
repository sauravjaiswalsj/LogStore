services:
  logstore-node-1:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: 8080
      LOGSTORE_NODE_ID: node-1
      LOGSTORE_LEADER: "true"
      LOGSTORE_REPLICATION_FACTOR: 3
      LOGSTORE_ACK_MODE: QUORUM
      LOGSTORE_PEERS: http://logstore-node-2:8080,http://logstore-node-3:8080
    ports:
      - "8080:8080"
    volumes:
      - ./data/node-1:/app/data/logstore

  logstore-node-2:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: 8080
      LOGSTORE_NODE_ID: node-2
      LOGSTORE_LEADER: "false"
      LOGSTORE_REPLICATION_FACTOR: 3
      LOGSTORE_ACK_MODE: QUORUM
      LOGSTORE_PEERS: http://logstore-node-1:8080,http://logstore-node-3:8080
    ports:
      - "8081:8080"
    volumes:
      - ./data/node-2:/app/data/logstore

  logstore-node-3:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: 8080
      LOGSTORE_NODE_ID: node-3
      LOGSTORE_LEADER: "false"
      LOGSTORE_REPLICATION_FACTOR: 3
      LOGSTORE_ACK_MODE: QUORUM
      LOGSTORE_PEERS: http://logstore-node-1:8080,http://logstore-node-2:8080
    ports:
      - "8082:8080"
    volumes:
      - ./data/node-3:/app/data/logstore

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    environment:
      LOGSTORE_API_BASE_URL: http://logstore-node-1:8080
    depends_on:
      - logstore-node-1
    ports:
      - "3000:3000"
