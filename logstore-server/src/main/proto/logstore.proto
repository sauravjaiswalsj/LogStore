syntax = "proto3";

package logstore.v1;

option java_multiple_files = true;
option java_package = "com.projects.logstore.proto";

service LogStoreService {
  rpc Append(AppendRequest) returns (AppendResponse);
  rpc Read(ReadRequest) returns (ReadResponse);
  rpc Replicate(ReplicationRecord) returns (ReplicationResponse);
  rpc FetchFromOffset(FetchFromOffsetRequest) returns (ReadResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc ClusterStatus(ClusterStatusRequest) returns (ClusterStatusResponse);
}

message AppendRequest {
  string stream = 1;
  string key = 2;
  bytes value = 3;
}

message AppendResponse {
  string stream = 1;
  int32 tablet_id = 2;
  int64 offset = 3;
  bool committed = 4;
  int32 persisted_replicas = 5;
}

message ReadRequest {
  string stream = 1;
  int64 offset = 2;
  int32 limit = 3;
}

message ReadResponse {
  repeated LogRecord records = 1;
  int64 next_offset = 2;
}

message FetchFromOffsetRequest {
  int32 tablet_id = 1;
  int64 offset = 2;
  int32 limit = 3;
}

message ReplicationRecord {
  string stream = 1;
  string key = 2;
  bytes value = 3;
  int64 offset = 4;
  int64 timestamp = 5;
}

message ReplicationResponse {
  bool success = 1;
  int64 offset = 2;
  int64 expected_offset = 3;
  string message = 4;
}

message LogRecord {
  string stream = 1;
  string key = 2;
  bytes value = 3;
  int64 offset = 4;
  int64 timestamp = 5;
}

message HealthRequest {}

message HealthResponse {
  bool healthy = 1;
}

message ClusterStatusRequest {}

message ClusterStatusResponse {
  string node_id = 1;
  bool leader = 2;
  string ack_mode = 3;
  int64 latest_offset = 4;
  int64 commit_offset = 5;
  repeated PeerStatus peers = 6;
}

message PeerStatus {
  string peer = 1;
  bool healthy = 2;
  int64 latest_offset = 3;
  int64 lag = 4;
  string message = 5;
}
